// Read once when KSP starts.

// The TCP port of the MCP endpoint, on 127.0.0.1 only: http://127.0.0.1:<port>/mcp/
port = 8770

// Whether every tool run shows a short message at the top of the screen, with its name and its arguments
// (never on what the screenshot tool captures): true or false
screen_messages = true

// Whether the server listens as soon as KSP starts: true or false. With false, it listens only once turned on
// from its button in the toolbar; turned off the same way, it closes its port again.
listen_at_start = true
